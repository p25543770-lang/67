name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run test:python
      - name: Build Windows installer
        shell: pwsh
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm run build:win 2>&1 | Tee-Object -FilePath build-win.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            Get-Content build-win.log | Select-Object -Last 40 | ForEach-Object {
              Write-Output "::error::$_"
            }
            exit $buildExitCode
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Depth-Studio-Windows-Installer
          path: release/Depth-Studio-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
